{% extends "base.html" %}

{% block title %}Conectando… · NutriaSyle{% endblock %}

{% block content %}
<main class="w-full min-h-screen bg-background flex items-center justify-center px-margin-mobile">
  <div class="flex flex-col items-center gap-space-md text-center" id="callback-box">
    <span class="material-symbols-outlined text-primary text-[40px] animate-spin">progress_activity</span>
    <p class="font-body-md text-body-md text-on-surface-variant" id="callback-message">Conectando tu cuenta de Google…</p>
    <a class="hidden font-label-md text-label-md uppercase tracking-wider text-primary hover:underline" href="{{ url_for('login_page') }}" id="callback-retry">Volver a intentar</a>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const accessToken = params.get("access_token");
      const messageEl = document.getElementById("callback-message");
      const retryEl = document.getElementById("callback-retry");

      if (!accessToken) {
        messageEl.textContent = "No se pudo completar el inicio de sesión con Google.";
        retryEl.classList.remove("hidden");
        return;
      }

      fetch("{{ url_for('auth_session') }}", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ access_token: accessToken }),
      })
        .then((res) => res.json())
        .then((data) => {
          if (data.ok) {
            window.location.href = "{{ url_for('fidelizacion') }}";
          } else {
            messageEl.textContent = "No se pudo completar el inicio de sesión con Google.";
            retryEl.classList.remove("hidden");
          }
        })
        .catch(() => {
          messageEl.textContent = "No se pudo completar el inicio de sesión con Google.";
          retryEl.classList.remove("hidden");
        });
    })();
  </script>
</main>
{% endblock %}
