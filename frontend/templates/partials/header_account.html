<header class="fixed top-0 left-0 w-full z-50 bg-surface-container-lowest/90 backdrop-blur-xl border-b border-outline-variant/30 shadow-[0_4px_24px_rgba(0,0,0,0.6)]">
  <div class="h-20 max-w-[1280px] mx-auto px-margin-mobile md:px-margin-desktop flex items-center justify-between gap-space-md">
    <div class="flex items-center gap-space-sm shrink-0">
      <img alt="NutriaSyle Logo" class="h-11 w-11 rounded-full object-cover" src="{{ url_for('static', path='img/logo.jpeg') }}" />
      <span class="font-headline-sm text-headline-sm text-primary tracking-wide hidden sm:inline-block">NutriaSyle</span>
    </div>
    <nav class="hidden xl:flex items-center gap-space-lg" data-active-classes="text-primary font-bold">
      <a class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant hover:text-primary transition-colors" data-path="inicio-historia" href="{{ url_for('home') }}">Inicio &amp; Historia</a>
      <a class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant hover:text-primary transition-colors" data-path="servicios-tarifas" href="{{ url_for('tarifas') }}">Servicios &amp; Tarifas</a>
      <a class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant hover:text-primary transition-colors" data-path="reservar-cita" href="{{ url_for('reservas') }}">Reservar Cita</a>
      <a class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant hover:text-primary transition-colors" data-path="equipo-resenas" href="{{ url_for('barberos') }}">Equipo &amp; Reseñas</a>
      <a class="relative font-label-md text-label-md uppercase tracking-wider text-on-surface-variant hover:text-primary transition-colors flex items-center gap-1.5" data-path="mi-cuenta-fidelidad" href="{{ url_for('fidelizacion') }}">Mi Cuenta &amp; Fidelidad<span class="inline-block w-2 h-2 rounded-full bg-primary ring-2 ring-primary/30 animate-pulse" title="Sello activo"></span></a>
    </nav>
    <div class="flex items-center gap-space-md shrink-0">
      <a class="hidden sm:inline-flex items-center justify-center px-space-md py-space-xs rounded-lg bg-primary text-on-primary font-label-md text-label-md uppercase tracking-wider hover:bg-primary-fixed-dim hover:text-on-primary-fixed transition-all shadow-[0_0_16px_rgba(229,193,88,0.25)]" data-path="reservar-cita" href="{{ url_for('reservas') }}">Reservar Cita</a>
      <a class="flex items-center gap-space-xs pl-space-xs border-l border-outline-variant/40 hover:opacity-95 transition-opacity" data-path="mi-cuenta-fidelidad" href="{{ url_for('fidelizacion') }}" title="Perfil del Socio">
        <div class="relative">
          <div class="w-9 h-9 rounded-full flex items-center justify-center bg-surface-container-high ring-2 ring-primary/70 shadow-[0_0_10px_rgba(229,193,88,0.3)] text-primary font-headline-sm text-[14px] font-bold uppercase">
            {{ display_name[0] }}
          </div>
          <span class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-secondary ring-2 ring-surface-container-lowest"></span>
        </div>
        <div class="flex flex-col text-left">
          <div class="flex items-center gap-1"><span class="font-label-md text-label-md text-on-surface leading-tight font-medium">{{ display_name }}</span></div>
          <div class="flex items-center gap-1"><span class="font-label-sm text-[10px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-secondary-container/70 border border-primary/30 text-primary leading-none font-semibold">Socio</span></div>
        </div>
      </a>
      {% if is_admin %}
      <a class="font-label-sm text-label-sm uppercase tracking-wider text-primary hover:text-primary-fixed-dim transition-colors font-bold" href="{{ url_for('admin_dashboard') }}">Panel Admin</a>
      {% endif %}
      <a class="font-label-sm text-label-sm uppercase tracking-wider text-outline hover:text-primary transition-colors" href="{{ url_for('logout') }}">Salir</a>
    </div>
  </div>
</header>
