<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>{% block title %}NutriaSyle{% endblock %}</title>
  <link href="{{ url_for('static', path='img/logo.jpeg') }}" rel="icon" type="image/jpeg" />

  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="{{ url_for('static', path='js/tailwind-config.js') }}"></script>

  {% block head_extra %}{% endblock %}
</head>
<body class="bg-background font-body-md text-body-md text-on-surface antialiased">
  {% block header %}{% endblock %}

  {% block content %}{% endblock %}

  {% include "partials/footer.html" %}
</body>
</html>
